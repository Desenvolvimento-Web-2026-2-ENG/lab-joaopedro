<!DOCTYPE HTML>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato com a equipe de suporte da Suporte Tech para esclarecer dúvidas e enviar suas solicitações.">
    <title>Apresentação</title>
</head>
<body>
    <header id="cabecalho">
        <h1>Área de Contato do Cliente</h1>
        <nav aria-label="Menu principal">
            <a href="#">Ajuda</a> |
            <a href="#">Sair</a>
        </nav>
    </header>
    <main id="corpo-da-pagina">
       <section>
         <h2>contato com o suporte</h2>
         <p>Envie sua mensagem para a nossa equipe de suporte backend</p>
        
         <form action="/enviar" method="POST">
              <article>
                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    minlength="3"
                    maxlength="100"
                    placeholder="Digite seu nome"
                >
                <br><br>
             <article>
             <article>
                <label for="email">E-mail:</label>
                <input 
                    type="email"
                    id="email"
                    name="email"
                    required
                    minlength="5"
                    maxlength="254"
                    placeholder="Digite seu e-mail"
                >
                <br><br>
             <article>
             <article>
                <label for="celular">Telefone celular:</label>
                <input 
                    type="tel"
                    id="celular"
                    name="celular"
                    pattern="[0-9]{11}"
                    minlength="11"
                    maxlength="11"
                    inputmode="numeric"
                    title="Digite 11 números, sem espaços, parênteses ou  traços."
                    required
                >
                <br><br>
             <article>
             <article>
                <label for="msg">Mensagem:</label>
                <textarea id="msg" name="msg" required></textarea>
                <br><br>
             <article>
                <button type="submit">Enviar mensagem</button>
         </form>
       </section>
    </main>

    <footer id="rodape">
        <p>Suporte Tech 2026</p>
    </footer>

</body>
</html>
